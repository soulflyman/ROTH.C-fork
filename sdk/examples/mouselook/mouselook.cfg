# mouselook.cfg — config for the mouselook plugin. Lives BESIDE plugin.so in mods/mouselook/.
# Delete/empty this file (or ROTH_MOUSELOOK=0) to disable; ROTH_MOUSELOOK_* env vars override
# whatever is set here (see the comment header in mouselook.c).

# Raw mickeys-per-pixel varies a lot by mouse DPI/polling rate, so these are a starting point,
# not a tuned value. Full circle = 65536 angle units; run with ROTH_MOUSELOOK_DEBUG=1 to see
# "dx=... -> angle=..." lines and scale sensitivity so a comfortable turn feels right.
sensitivity  = 1.5    # yaw: higher = faster turning per pixel of mouse motion
pitch_scale  = 0.2    # pitch: the engine clamps the final value to a small range regardless
invert_pitch = 0      # 1 = invert vertical look (mouse up -> look down)
